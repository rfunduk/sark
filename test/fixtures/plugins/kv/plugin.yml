allow_sql: true

patchable:
  notes: [body]

include:
  - tools/reads.yml
  - tools/writes/*.yml

tools:
  total:
    description: Count of rows.
    returns: scalar
    sql: |
      SELECT COUNT(*) AS n FROM kv

pipelines:
  inventory_ingest:
    description: Deterministic ingest — load rows and upsert.
    schedule: "0 3 * * *"
    steps:
      - load: SELECT key, value FROM kv

  note_add:
    description: Single-tool pipeline that wraps add_note. Unscheduled.
    steps:
      - tool: add_note

  smoke:
    description: LLM pipeline — list keys and pick one.
    schedule: "0 0 1 1 0"
    steps:
      - llm:
          model: claude-haiku-4-5
          tools: [list, get]
          max_turns: 4
          system: |
            You are a smoke-test pipeline for the kv plugin. Be terse.
          prompt: |
            List the keys in the kv store and pick one to summarize.
