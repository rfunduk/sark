tools:
  add_note:
    description: Insert a note, returns the new id.
    returns: results
    write: true
    params:
      body: { type: text }
    sql: |
      INSERT INTO notes (body) VALUES (:body) RETURNING id

  reset_note:
    description: Multi-statement — delete any note with this body, then insert a fresh one.
    returns: results
    write: true
    params:
      body: { type: text }
    sql:
      - DELETE FROM notes WHERE body = :body
      - INSERT INTO notes (body) VALUES (:body) RETURNING id

  bulk_add_notes:
    description: Insert N notes in one call. `notes` is an array of objects.
    returns: count
    write: true
    params:
      notes:
        type: array
        required: true
        items:
          type: object
          properties:
            body: { type: text, required: true }
    sql: |
      INSERT INTO notes (body)
      SELECT json_extract(value, '$.body')
      FROM json_each(:notes)

  record_caller:
    description: |
      Insert a notes row tagged with iss:name from the implicit :sark_auth
      binding. Used to verify auth envelope plumbing from both MCP + pipeline
      callers.
    returns: results
    write: true
    sql: |
      INSERT INTO notes (body) VALUES (
        json_extract(:sark_auth, '$.iss') || ':' || json_extract(:sark_auth, '$.name')
      ) RETURNING id

  secret_note:
    description: "Worker-only note insert (used to test internal flag)."
    internal: true
    returns: results
    write: true
    params:
      body: { type: text }
    sql: |
      INSERT INTO notes (body) VALUES (:body) RETURNING id
